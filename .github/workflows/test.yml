name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VnTool.sln
      - name: Build
        run: dotnet build VnTool.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test VnTool.sln --no-build --configuration Release --logger "console;verbosity=normal"
