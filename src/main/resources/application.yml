server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: story-editor

  datasource:
    url: jdbc:h2:mem:story-editor-dev;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  jackson:
    serialization:
      indent-output: true

logging:
  level:
    org.hibernate.SQL: info